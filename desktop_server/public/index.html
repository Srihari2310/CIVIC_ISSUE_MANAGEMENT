<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Civic Issue Authority Dashboard</title>
    <style>
      body {
        margin: 0;
        font-family: Segoe UI, Arial, sans-serif;
        background: #f2f4f8;
        color: #1f2937;
      }
      header {
        background: #0b57d0;
        color: white;
        padding: 16px 20px;
      }
      main {
        padding: 20px;
        max-width: 1100px;
        margin: 0 auto;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 16px;
      }
      .card {
        background: white;
        border-radius: 10px;
        padding: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }
      .card img {
        width: 100%;
        height: 180px;
        object-fit: cover;
        border-radius: 8px;
        margin-bottom: 10px;
      }
      .meta {
        font-size: 14px;
        line-height: 1.5;
      }
      .empty {
        background: white;
        border-radius: 10px;
        padding: 18px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <header>
      <h2>Civic Issues - Municipal Authority Dashboard</h2>
    </header>
    <main>
      <div id="content" class="empty">No reports received yet.</div>
    </main>

    <script>
      async function loadReports() {
        try {
          const response = await fetch('/api/reports');
          const reports = await response.json();
          const content = document.getElementById('content');

          if (!Array.isArray(reports) || reports.length === 0) {
            content.className = 'empty';
            content.innerHTML = 'No reports received yet.';
            return;
          }

          content.className = 'grid';
          content.innerHTML = reports
            .map((report) => {
              const imageSrc = report.image?.base64Data
                ? `data:${report.image?.mimeType || 'image/jpeg'};base64,${report.image.base64Data}`
                : '';

              return `
                <div class="card">
                  ${imageSrc ? `<img src="${imageSrc}" alt="Issue" />` : ''}
                  <div class="meta"><strong>Issue:</strong> ${report.issueType || '-'}</div>
                  <div class="meta"><strong>Description:</strong> ${report.description || '-'}</div>
                  <div class="meta"><strong>Timestamp:</strong> ${report.timestampDisplay || report.timestamp || '-'}</div>
                  <div class="meta"><strong>Location:</strong> ${report.location ? `${report.location.latitude}, ${report.location.longitude}` : 'Not provided'}</div>
                  <div class="meta"><strong>Status:</strong> ${report.status || '-'}</div>
                </div>
              `;
            })
            .join('');
        } catch (error) {
          const content = document.getElementById('content');
          content.className = 'empty';
          content.innerHTML = `Failed to load reports: ${error}`;
        }
      }

      loadReports();
      setInterval(loadReports, 4000);
    </script>
  </body>
</html>
